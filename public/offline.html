<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gimme Golf — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #16263B;
      color: #F2ECDD;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { margin-bottom: 1.5rem; display: flex; justify-content: center; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    button {
      background: #C2A24C;
      color: #16263B;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; transform: scale(0.97); }
  </style>
</head>
<body>
  <!-- The Gimme seal, inlined from src/components/brand/Seal.tsx (cream ring, brass ring, serif G). -->
  <div class="icon">
    <svg width="64" height="78" viewBox="0 0 100 122" fill="none" role="img" aria-label="Gimme">
      <ellipse cx="50" cy="61" rx="47" ry="58" stroke="#F2ECDD" stroke-width="2.5" />
      <ellipse cx="50" cy="61" rx="40.5" ry="51.5" stroke="#C2A24C" stroke-width="1.5" />
      <text x="50" y="61" text-anchor="middle" dominant-baseline="central" font-family="'Playfair Display', Georgia, serif" font-size="66" font-weight="600" fill="#F2ECDD">G</text>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Check your connection and try again. Your scores are safe in the cloud.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
